<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Old Bank - Digital</title>
    <link rel="stylesheet" href="/style.css">
    <!-- Importando uma fonte moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="card">
        <header>
            <div class="brand">
                <h1>Old<span>Bank</span></h1>
                <div class="status-badge">Digital</div>
            </div>
            
            <div class="user-info">
                <p>Olá, <strong>Gertrudes Folha</strong></p>
                <div class="balance-box">
                    <span>Saldo em conta</span>
                    <h3>R$ 8.809,00</h3>
                </div>
            </div>
        </header>

        <section class="transactions">
            <h2>Transações Recentes</h2>
            <table>
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Descrição</th>
                        <th>Categoria</th>
                        <th class="align-right">Valor</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>31 Ago</td>
                        <td><strong>Smartfit</strong></td>
                        <td><span class="tag">Academia</span></td>
                        <td class="value negative">- R$ 100,00</td>
                    </tr>
                    <tr>
                        <td>02 Set</td>
                        <td><strong>Supermercado Costa</strong></td>
                        <td><span class="tag">Alimentação</span></td>
                        <td class="value negative">- R$ 250,00</td>
                    </tr>
                    <tr>
                        <td>08 Set</td>
                        <td><strong>Aposentadoria</strong></td>
                        <td><span class="tag special">Renda</span></td>
                        <td class="value positive">+ R$ 5.000,00</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </div>

</body>
</html>
